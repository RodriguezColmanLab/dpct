name: Build wheels and sdist (cibuildwheel)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        # Only build on ubuntu-latest for now
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python (helper for some build steps)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build-time Python dependencies
        run: |
          pip install build scikit-build-core pybind11

      - name: Build source distribution (sdist)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --sdist --outdir dist

      - name: Build wheels with cibuildwheel
        env:
          # Specifies which versions we compile for - https://cibuildwheel.pypa.io/en/stable/options/#build-skip
          CIBW_BUILD: "cp311-* cp312-*"
        run: |
          pip install cibuildwheel
          cibuildwheel --output-dir wheelhouse

      - name: Show produced archives
        run: |
          echo "Contents of wheelhouse (if any):"
          ls -la wheelhouse || true
          echo "Contents of dist (if any):"
          ls -la dist || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: |
            wheelhouse
            dist

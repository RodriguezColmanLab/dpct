name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-pip-install:
    # Smoke test for the `pip install git+https://...#egg=dpct` install path
    # used in environments without Conda access (see pyproject.toml /
    # cmake/VendorDeps.cmake). Builds from source, vendoring LEMON and
    # jsoncpp, exactly as an end user would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip install from local checkout (simulates `pip install git+...`)
        run: pip install -v .

      - name: smoke test import
        run: |
          python -c "import dpct; print(dpct.__file__); print([f for f in dir(dpct) if not f.startswith('_')])"

